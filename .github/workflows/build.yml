name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend
        run: dotnet restore backend/Current.Api.Tests/Current.Api.Tests.csproj

      - name: Build backend
        run: dotnet build backend/Current.Api.Tests/Current.Api.Tests.csproj -c Release --no-restore

      - name: Test backend
        run: dotnet test backend/Current.Api.Tests/Current.Api.Tests.csproj -c Release --no-build --verbosity normal

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/current-ui/package-lock.json

      - name: Install UI dependencies
        working-directory: frontend/current-ui
        run: npm ci

      - name: Build UI
        working-directory: frontend/current-ui
        run: npm run build -- --configuration=docker
