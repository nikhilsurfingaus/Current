<div class="main-layout">
  <aside class="sidebar">
    <a class="sidebar__brand" routerLink="/dashboard" aria-label="Current home">
      <span class="sidebar__brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <path
            d="M5.5 13.2c3.8-2.6 7.6-2.4 12.2-1.1 1.9.6 3.4 1.2 5.1 1.5"
            stroke="url(#sidebar-wave-top)"
            stroke-width="3.2"
            stroke-linecap="round"
          />
          <path
            d="M6.8 19.4c4.4-2.8 8.8-2.5 13.7-.8 1.5.5 2.8 1 4.3 1.3"
            stroke="url(#sidebar-wave-bottom)"
            stroke-width="3.2"
            stroke-linecap="round"
          />
          <defs>
            <linearGradient id="sidebar-wave-top" x1="5.5" y1="13" x2="23" y2="13" gradientUnits="userSpaceOnUse">
              <stop stop-color="#4CC9F0" />
              <stop offset="1" stop-color="#2F80ED" />
            </linearGradient>
            <linearGradient id="sidebar-wave-bottom" x1="6.8" y1="19" x2="25" y2="19" gradientUnits="userSpaceOnUse">
              <stop stop-color="#2F80ED" />
              <stop offset="1" stop-color="#1D4ED8" />
            </linearGradient>
          </defs>
        </svg>
      </span>
      <span class="sidebar__brand-name">Current</span>
    </a>

    <nav class="sidebar__nav">
      <a class="sidebar__link" routerLink="/dashboard" routerLinkActive="sidebar__link--active">
        <span class="sidebar__icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5" />
            <rect x="13" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5" />
            <rect x="3" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5" />
            <rect x="13" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </span>
        Dashboard
      </a>
      <a class="sidebar__link" routerLink="/accounts" routerLinkActive="sidebar__link--active">
        <span class="sidebar__icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="6" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.5" />
            <path d="M3 10h18" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </span>
        Accounts
      </a>
      <a class="sidebar__link" routerLink="/goals" routerLinkActive="sidebar__link--active">
        <span class="sidebar__icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.5" />
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </span>
        Goals
      </a>
      <a class="sidebar__link" routerLink="/transfer" routerLinkActive="sidebar__link--active">
        <span class="sidebar__icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M7 8l5-4 5 4M7 16l5 4 5-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </span>
        Transfer
      </a>
      <a class="sidebar__link" routerLink="/transactions" routerLinkActive="sidebar__link--active">
        <span class="sidebar__icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </span>
        Transactions
      </a>
      <a class="sidebar__link" routerLink="/analytics" routerLinkActive="sidebar__link--active">
        <span class="sidebar__icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M4 18V6M10 18V10M16 18V4M22 18V8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </span>
        Analytics
      </a>
    </nav>

    <div class="sidebar__user">
      <span class="sidebar__avatar">{{ userInitials() }}</span>
      <div class="sidebar__user-text">
        <p class="sidebar__user-name">{{ userDisplayName() }}</p>
        <p class="sidebar__user-email">{{ userEmail() }}</p>
      </div>
    </div>
  </aside>

  <div class="main-layout__content">
    <header class="topbar" [class.topbar--with-subtitle]="isDashboardRoute()">
      <div class="topbar__heading">
        <h1 class="topbar__title">{{ greetingLabel() }}</h1>
        @if (isDashboardRoute()) {
          <p class="topbar__subtitle">Here's what's happening with your money today.</p>
        }
      </div>
      <div class="topbar__actions">
        <button class="topbar__logout" type="button" (click)="logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M10 7V5a2 2 0 0 1 2-2h7v18h-7a2 2 0 0 1-2-2v-2" stroke="currentColor" stroke-width="1.5" />
            <path d="M14 12H3m0 0 3-3m-3 3 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          Log out
        </button>
      </div>
    </header>

    <main class="page">
      <router-outlet />
    </main>

    <footer class="app-footer">
      <span>Privacy</span>
      <span class="app-footer__dot">·</span>
      <span>Terms</span>
      <span class="app-footer__dot">·</span>
      <span>Security</span>
      <span class="app-footer__copy">© {{ currentYear }} Current</span>
    </footer>
  </div>
</div>
