<div class="toast-container" aria-live="polite" aria-atomic="true">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="toast"
      [class.toast--success]="toast.type === 'success'"
      [class.toast--error]="toast.type === 'error'"
      role="status"
    >
      <div class="toast__body">
        <span class="toast__icon" [class.toast__icon--success]="toast.type === 'success'" [class.toast__icon--error]="toast.type === 'error'" aria-hidden="true">
          @if (toast.type === 'success') {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" />
            </svg>
          }
        </span>

        <div class="toast__content">
          <p class="toast__message">{{ toast.message }}</p>
          @if (toast.action) {
            <a class="toast__action" [routerLink]="toast.action.route" (click)="dismissToast(toast.id)">
              {{ toast.action.label }}
            </a>
          }
        </div>

        <button class="toast__dismiss" type="button" aria-label="Dismiss" (click)="dismissToast(toast.id)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <div class="toast__progress" [style.animation-duration.ms]="toast.durationMs"></div>
    </div>
  }
</div>
