<div class="notification-bell">
  <button
    class="notification-bell__trigger"
    type="button"
    [attr.aria-expanded]="panelOpen()"
    aria-controls="notification-panel"
    [attr.aria-label]="unreadCount() > 0 ? unreadCount() + ' unread notifications' : 'Notifications'"
    (click)="togglePanel()"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path d="M9.5 17a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    </svg>
    @if (unreadCount() > 0) {
      <span class="notification-bell__badge">{{ unreadCount() > 9 ? '9+' : unreadCount() }}</span>
    }
  </button>

  @if (panelOpen()) {
    <div id="notification-panel" class="notification-bell__panel" role="region" aria-label="Notifications">
      <div class="notification-bell__panel-header">
        <h2 class="notification-bell__panel-title">Notifications</h2>
        @if (unreadCount() > 0) {
          <button class="notification-bell__mark-all" type="button" (click)="onMarkAllRead()">
            Mark all read
          </button>
        }
      </div>

      @if (notificationsLoading()) {
        <p class="notification-bell__empty">Loading...</p>
      } @else if (notifications().length === 0) {
        <p class="notification-bell__empty">No notifications yet.</p>
      } @else {
        <ul class="notification-bell__list">
          @for (notification of notifications(); track notification.id) {
            <li>
              <button
                class="notification-bell__item"
                [class.notification-bell__item--unread]="!notification.isRead"
                type="button"
                (click)="onNotificationClick(notification, $event)"
              >
                <div class="notification-bell__item-main">
                  <p class="notification-bell__item-title">{{ notification.title }}</p>
                  <p class="notification-bell__item-body">{{ notification.body }}</p>
                </div>
                <span class="notification-bell__item-time">
                  {{ formatNotificationRelativeTime(notification.createdAt) }}
                </span>
              </button>
            </li>
          }
        </ul>
      }
    </div>
  }
</div>
